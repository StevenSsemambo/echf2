# ── YoEcho — Netlify Configuration ───────────────────────────────────────────

[build]
  publish = "public"
  functions = "netlify/functions"

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

# 3D face files: big, rarely change, so let browsers keep them for a week
[[headers]]
  for = "/avatars/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
